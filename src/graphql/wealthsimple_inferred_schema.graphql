"""
Inferred Wealthsimple GraphQL SDL derived from query documents in:
https://github.com/gboudreau/ws-api-php (src/WealthsimpleAPI.php)
and additional GraphQL operations embedded in the public Wealthsimple SPA bundle.

This is intentionally approximate and query-driven (not introspection-derived).
"""

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

scalar Date
scalar DateTime
scalar Cursor
scalar Currency
scalar JSON
scalar ISO8601DateTime

enum ActivitiesOrderBy {
  OCCURRED_AT_DESC
  OCCURRED_AT_ASC
}

enum AccountScope {
  OWN
  ALL
}

enum DateResolution {
  DAILY
  WEEKLY
  MONTHLY
}

enum TradingSession {
  REGULAR
  OVERNIGHT
}

enum ChartPeriod {
  ONE_DAY
  ONE_MONTH
  THREE_MONTHS
  YEAR_TO_DATE
  ONE_YEAR
  FIVE_YEARS
  ALL
}

enum BalanceType {
  TRADING
  SETTLED
  CASH
  TOTAL
}

type Query {
  identity(id: ID!): Identity
  accounts(ids: [String!]!): [Account!]!
  account(id: ID!): Account
  security(id: ID!): Security
  securitySearch(input: SecuritySearchInput!): SecuritySearchPayload!
  activityFeedItems(
    first: Int
    after: Cursor
    condition: ActivityCondition
    orderBy: [ActivitiesOrderBy!] = [OCCURRED_AT_DESC]
  ): ActivityFeedItemConnection!
  fundsTransfer(id: ID!, include_cancelled: Boolean): FundsTransfer
  accountTransfer(id: ID!): InstitutionalTransfer
  corporateActionChildActivities(
    condition: CorporateActionChildActivitiesCondition!
  ): CorporateActionChildActivitiesPayload!
  brokerageMonthlyStatements(period: String!, accountId: String!): [BrokerageMonthlyStatement!]!
  creditCardAccount(id: ID!): CreditCardAccount
  transfer(id: ID!): Transfer
  search_transfers(filter: SearchTransfersFilterInput): SearchTransfersPayload
  creditCardActivities(
    creditAccountId: String!
    endDate: ISO8601DateTime
    first: Int
    startDate: ISO8601DateTime
    statuses: [CreditCardActivityStatusEnum!]
  ): CreditCardActivitiesPayload
  dataRequestsByIdentity(identityId: ID!): [DataRequest!]!
  zendeskDecagonPublicAuth: PublicZendeskDecagonAuth
  employeesBreakdownByStatus(employerId: String!): EmployeesBreakdownByStatus
}

type Mutation {
  accountsCloseAsync(input: AccountsCloseAsyncInput!): AccountsCloseAsyncPayload
  update_transfer_state(input: UpdateTransferStateInput!): Transfer
  transfer_staff_update(input: TransferStaffUpdateMutationInput!): Transfer
  reissueCard(input: ReissueCardInput!): ReissueCardPayload
  resetCreditCardPINRetryCounter(
    input: ResetCreditCardPINRetryCounterInput!
  ): ResetCreditCardPINRetryCounterResult
  unblockCreditCard(input: UnblockCreditCardInput!): UnblockCreditCardResult
  personalDataUpdate(input: PersonalDataUpdateInput!): PersonalDataUpdatePayload
  signDocumentUrl(bucket: String, key: String!): SignedDocumentUrl
}

type Subscription {
  securityQuoteUpdates(id: ID!): SecurityQuoteUpdate
}

input SecuritySearchInput {
  query: String!
}

input ActivityCondition {
  startDate: Date
  endDate: Date
  accountIds: [ID!]
}

input CorporateActionChildActivitiesCondition {
  activityCanonicalId: String!
}

input AccountsFilter {
  accountIds: [ID!]
  accountTypes: [String!]
}

input IdentityFinancialsFilter {
  accounts: [ID!]
}

input PositionsFilter {
  securityIds: [ID!]
}

input SearchTransfersFilterInput {
  account_ids: [ID!]
}

input AccountsCloseAsyncInput {
  accountIds: [ID!]!
}

input UpdateTransferStateInput {
  transferId: ID
  event: String
  transitionCode: String
  notes: String
}

input TransferStaffUpdateMutationInput {
  id: ID
  transitionCode: String
  notes: String
  pdf_url: String
}

input ReissueCardInput {
  cardCanonicalId: ID
  reason: String
}

input ResetCreditCardPINRetryCounterInput {
  cardCanonicalId: ID!
}

input UnblockCreditCardInput {
  cardCanonicalId: String!
}

input PersonalDataUpdateInput {
  identityId: ID
  payload: JSON
}

enum CreditCardActivityStatusEnum {
  PENDING
  POSTED
  DECLINED
  REVERSED
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: Cursor
}

type Money {
  amount: String
  cents: Int
  currency: Currency
}

type Identity {
  id: ID!
  accounts(filter: AccountsFilter, first: Int, after: Cursor): AccountConnection!
  financials(filter: IdentityFinancialsFilter, accountScope: AccountScope): IdentityFinancials
  zendeskDecagonAuth(useV2: Boolean): IdentityZendeskDecagonAuth
}

type IdentityFinancials {
  current(currency: Currency, startDate: Date): IdentityCurrentFinancials
  historicalDaily(
    currency: Currency!
    startDate: Date
    endDate: Date
    first: Int
    after: Cursor
  ): IdentityHistoricalDailyConnection!
  realizedReturns(currency: Currency!, startDate: Date): RealizedReturns
  dividendsV2(startDate: Date, currency: Currency!): DividendsV2
}

type IdentityCurrentFinancials {
  netLiquidationValueV2: Money
  netDepositsV2: Money
  simpleReturns(referenceDate: Date): SimpleReturns
  totalDepositsV2: Money
  totalWithdrawalsV2: Money
  positions(filter: PositionsFilter): PositionConnection!
}

type SimpleReturns {
  amount: Money
  asOf: DateTime
  rate: Float
  referenceDate: Date
}

type AccountConnection {
  edges: [AccountEdge!]!
  pageInfo: PageInfo!
}

type AccountEdge {
  cursor: Cursor
  node: Account!
}

